<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070608"><title>Crimson • Scramjet</title><style>
:root{color-scheme:dark;font:14px system-ui;background:#070608;color:#f4edf0}*{box-sizing:border-box}body{margin:0;padding:28px;background:radial-gradient(ellipse at top,#6e1028 0,transparent 42%),#070608;min-height:100vh}header,main{max-width:1000px;margin:0 auto}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:35px;height:35px;border:8px solid #e51d4e;transform:rotate(12deg);display:inline-block}h1{font-size:20px;margin:0}small,.hint{color:#a99ba3}form{display:flex;gap:9px;margin:20px 0}input{flex:1;min-width:0;background:#100d11;border:1px solid #35232c;border-radius:10px;padding:14px;color:white}button{background:#d71943;border:0;border-radius:10px;color:white;padding:0 18px;font-weight:700;cursor:pointer}#status{color:#b8aab1;font-size:12px}#frame{width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid #35232c;border-radius:12px;background:#0e0b10}a{color:#ff5274}
</style><script src="/scram/scramjet.all.js"></script><script src="/baremux/index.js"></script></head><body><header><span class="mark"></span><div><h1>CRIMSON / SCRAMJET</h1><small>Proxy engine · experimental</small></div></header><main><form id="form"><input id="address" autocomplete="url" placeholder="Enter a website or search" aria-label="Website address" required><button>Go</button></form><p class="hint" id="status">Initializing Scramjet…</p><div id="frames"></div><p class="hint">Only use this service in accordance with applicable law and the destination site's terms.</p></main><script>
const input=document.querySelector("#address"),status=document.querySelector("#status");const {ScramjetController}= $scramjetLoadController();const sj=new ScramjetController({files:{wasm:"/scram/scramjet.wasm.wasm",all:"/scram/scramjet.all.js",sync:"/scram/scramjet.sync.js"}});sj.init();const mux=new BareMux.BareMuxConnection("/baremux/worker.js");function normalize(v){v=v.trim();if(!v)return "";if(v.includes(" ")||!v.includes("."))return "https://www.google.com/search?q="+encodeURIComponent(v);return /^https?:\/\//i.test(v)?v:"https://"+v}
async function go(v){const url=normalize(v);if(!url)return;input.value=url;status.textContent="Registering proxy worker…";try{if(!navigator.serviceWorker)throw new Error("This browser does not support service workers.");await navigator.serviceWorker.register("/sw.js");const ws=(location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/wisp/";await mux.setTransport("/libcurl/index.mjs",[{websocket:ws}]);document.querySelector("#frames").replaceChildren();const f=sj.createFrame();f.frame.id="scramjet-frame";f.frame.style.cssText="width:100%;height:calc(100vh - 210px);min-height:420px;border:0;border-radius:12px;background:#fff";document.querySelector("#frames").append(f.frame);f.go(url);status.textContent="Scramjet active · "+url}catch(e){status.textContent="Could not start Scramjet: "+e.message}}
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();go(input.value)});const initial=new URLSearchParams(location.search).get("url");if(initial){input.value=initial;go(initial)}else status.textContent="Ready · Scramjet is selected";
</script></body></html>
